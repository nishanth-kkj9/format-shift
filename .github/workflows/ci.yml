name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - name: Lockfile check
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json || {
            echo "package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' and commit."
            exit 1
          }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - run: npm test -- --coverage
      # Public repo, but this is a protected branch (main) upload, and the
      # Codecov org has token auth required (default for existing orgs), so
      # tokenless uploads are rejected. The repository owner must add the
      # CODECOV_TOKEN repository secret (Codecov "Configure" tab -> token);
      # the action reads it from the token input below.
      #
      # Source-aware policy: repository secrets are NOT available to
      # fork-originated pull requests, so an authenticated upload would fail for
      # external contributors even when tests/coverage pass. Run the upload only
      # for trusted contexts — main-branch pushes and same-repository PRs, where
      # CODECOV_TOKEN exists — and skip ONLY the upload step for fork PRs (their
      # tests and coverage still run above). fail_ci_if_error stays true so a
      # failed upload on a trusted main push still fails the job.
      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Playwright end-to-end suite against the built app (dist/server.cjs serves
  # frontend + API via the webServer block in playwright.config.ts; `test:e2e`
  # builds first and FFmpeg resolves through the bundled ffmpeg-static).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: fs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fs:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
