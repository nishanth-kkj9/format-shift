name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - name: Lockfile check
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json || {
            echo "package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' and commit."
            exit 1
          }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - run: npm test -- --coverage
      # Public repo, but this is a protected branch (main) upload, and the
      # Codecov org has token auth required (default for existing orgs), so
      # tokenless uploads are rejected. The repository owner must add the
      # CODECOV_TOKEN repository secret (Codecov "Configure" tab -> token);
      # the action reads it from the token input below.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm@11.16.0 (package.json packageManager). Older
      # npm rewrites it on --package-lock-only, failing the Lockfile check below.
      - name: Pin npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fs:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
