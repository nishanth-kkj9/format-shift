name: Bug report
description: Report a bug in FormatShift
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Where does it happen?
      description: Local dev (vite/tsx), built server, or Docker?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Conversion type
      options: [image, audio, video, document, data, other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or browser console output
      render: shell
